<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔬 Centro de Investigación · EduVerse</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <a href="../../index.html" class="btn-back">← Portal Principal</a>

    <main class="research-center">

        <header class="hero">
            <h1>🔬 Centro de <span>Investigación</span></h1>
            <p>Selecciona una estación para comenzar tu exploración</p>
        </header>

        <section class="hub">

            <!-- ═══ RESPLANDOR CENTRAL ═══ -->
            <div class="hub-glow"></div>

            <!-- ═══ LÍNEAS ═══ -->
            <div class="line line-solar"></div>
            <div class="line line-atomic"></div>
            <div class="line line-biology"></div>

            <!-- ═══ LÍNEAS INFERIORES ═══ -->
            <div class="line line-vertical-bottom"></div>
            <div class="line line-horizontal-bottom-left"></div>
            <div class="line line-horizontal-bottom-right"></div>

            <!-- ═══ NÚCLEO ═══ -->
            <div class="core">
                <div class="core-icon">🔬</div>
                <div class="core-title">Laboratorio</div>
                <div class="core-sub">Central</div>
                <div class="core-status">● Sistema operativo</div>
            </div>

            <!-- ═══ ESTACIONES ═══ -->
            <a href="../../modulos/ciencias/sistema-solar/index.html" class="station solar" data-line="line-solar">
                <span class="emoji">🌞</span>
                <span class="title">Estación Espacial</span>
                <span class="badge active">Activa</span>
            </a>

            <div class="station atomic locked" data-line="line-atomic">
                <span class="emoji">⚛️</span>
                <span class="title">Cuántica</span>
                <span class="badge locked">🔜</span>
            </div>

        <a href="../../modulos/ciencias/celulas/index.html" class="station biology" data-line="line-biology">
        <span class="emoji">🔬</span>
        <span class="title">Microscópica</span>
        <span class="badge active">Activa</span>
        </a>

            <!-- Geología -->
            <div class="station volcano locked" data-line="line-vertical-bottom line-horizontal-bottom-left">
                <span class="emoji">🌋</span>
                <span class="title">Geología</span>
                <span class="badge locked">🔜</span>
            </div>

            <!-- Paleontología -->
            <div class="station dino locked" data-line="line-vertical-bottom line-horizontal-bottom-right">
                <span class="emoji">🦖</span>
                <span class="title">Paleontología</span>
                <span class="badge locked">🔜</span>
            </div>

        </section>

        <p class="footer-info">🌌 EduVerse · Centro de Investigación</p>

    </main>

    <!-- ══════════════════════════════════════════ -->
    <!-- 🚀 EFECTO DE HOVER EN LÍNEAS              -->
    <!-- ══════════════════════════════════════════ -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            const stations = document.querySelectorAll('.station');

            function resetLines() {
                document.querySelectorAll('.line').forEach(line => {
                    line.style.background = '';
                    line.style.boxShadow = '';
                    line.style.opacity = '';
                });
            }

            function highlightLines(lineClasses) {
                const classes = lineClasses.split(' ');
                classes.forEach(cls => {
                    const targetLine = document.querySelector('.' + cls);
                    if (targetLine) {
                        targetLine.style.background = 'rgba(34, 211, 238, 0.8)';
                        targetLine.style.boxShadow = '0 0 20px rgba(34, 211, 238, 0.4)';
                        targetLine.style.opacity = '1';
                    }
                });
            }

            stations.forEach(station => {
                station.addEventListener('mouseenter', function() {
                    const lineClass = this.dataset.line;
                    if (lineClass) {
                        resetLines();
                        highlightLines(lineClass);
                    }
                });

                station.addEventListener('mouseleave', function() {
                    resetLines();
                });
            });

        });
    </script>

</body>
</html>
