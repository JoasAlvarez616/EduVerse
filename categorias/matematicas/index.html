<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>➗ Matemáticas · EduVerse</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../style.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <a href="../../index.html" class="btn-back">← Portal Principal</a>

    <main class="matematicas-container">

        <header class="hero">
            <h1>➗ <span>Sala de Desafíos</span></h1>
            <p>Elige un desafío para poner a prueba tu lógica</p>
        </header>

        <!-- ══════════════════════════════════════════ -->
        <!-- DESAFÍOS                                  -->
        <!-- ══════════════════════════════════════════ -->
        <section class="desafios">

            <!-- Aritmética (Activo) -->
            <a href="#" class="desafio-item activo">
                <div class="desafio-icono">🔢</div>
                <div class="desafio-info">
                    <h3>Aritmética</h3>
                    <p>Suma, resta, multiplicación y división</p>
                </div>
                <div class="desafio-estado">
                    <span class="badge">Activo</span>
                </div>
            </a>

            <!-- Geometría (Bloqueado) -->
            <div class="desafio-item bloqueado">
                <div class="desafio-icono">📐</div>
                <div class="desafio-info">
                    <h3>Geometría</h3>
                    <p>Formas, ángulos y dimensiones</p>
                </div>
                <div class="desafio-estado">
                    <span class="badge locked">🔜</span>
                </div>
            </div>

            <!-- Fracciones (Bloqueado) -->
            <div class="desafio-item bloqueado">
                <div class="desafio-icono">🧮</div>
                <div class="desafio-info">
                    <h3>Fracciones</h3>
                    <p>Partes de un todo</p>
                </div>
                <div class="desafio-estado">
                    <span class="badge locked">🔜</span>
                </div>
            </div>

        </section>

        <p class="footer-info">🌌 EduVerse · Sala de Desafíos</p>

    </main>

</body>
</html>
